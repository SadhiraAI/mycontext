[project]
name = "mycontext-ai"
version = "0.2.0"
description = "Universal Context Transformation Engine - Transform questions into perfect, portable contexts"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "SadhiraAI", email = "hello@sadhiraai.com" }
]
keywords = ["llm", "context-engineering", "prompt-engineering", "ai", "gpt", "claude", "langchain", "langgraph", "transformation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.9.0",
    "tiktoken>=0.8.0",
    "jinja2>=3.1.4",
    "pyyaml>=6.0.2",
    "structlog>=24.4.0",
    "httpx>=0.27.2",
]

[project.optional-dependencies]
# LLM Provider integrations
openai = ["openai>=1.54.0"]
anthropic = ["anthropic>=0.39.0"]
google = ["google-genai>=0.3.0"]  # New official SDK (fallback to google-generativeai if needed)
aws = ["boto3>=1.35.0"]
azure = ["azure-ai-inference>=1.0.0b4"]

# Knowledge & RAG features
rag = [
    "chromadb>=0.5.17",
    "faiss-cpu>=1.9.0",
    "sentence-transformers>=3.3.0",
]

# Storage backends
redis = ["redis>=5.2.0"]
postgres = ["psycopg[binary]>=3.2.0"]
sqlite = ["aiosqlite>=0.20.0"]

# Observability
monitoring = [
    "prometheus-client>=0.21.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
]

# Development tools
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
    "mypy>=1.13.0",
    "ruff>=0.7.4",
    "black>=24.10.0",
    "ipython>=8.29.0",
    "pre-commit>=4.0.0",
]

# Documentation
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.26.0",
]

# All features
all = [
    "mycontext-ai[openai,anthropic,google,rag,redis,postgres,monitoring]",
]

[project.urls]
Homepage = "https://github.com/SadhiraAI/mycontext"
Documentation = "https://github.com/SadhiraAI/mycontext#readme"
Repository = "https://github.com/SadhiraAI/mycontext"
Changelog = "https://github.com/SadhiraAI/mycontext/blob/main/CHANGELOG.md"
Issues = "https://github.com/SadhiraAI/mycontext/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mycontext"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
]

[tool.coverage.run]
source = ["src/mycontext"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
