[project]
name = "mycontext-ai"
version = "0.8.0"
description = "Context engineering for LLMs — 87 cognitive patterns, prompt compilation, 3-tier execution, 13 export formats"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "SadhiraAI", email = "hello@sadhiraai.com" }
]
keywords = ["llm", "context-engineering", "prompt-engineering", "ai", "gpt", "claude", "langchain", "langgraph", "transformation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.11.0",
    "pyyaml>=6.0.2",
    "litellm>=1.55.0",  # Required for ctx.execute() — routes to OpenAI, Anthropic, Gemini, 100+ providers
    "pandas>=3.0.1",
]

[project.optional-dependencies]
# LLM Provider integrations
openai = ["openai>=2.0.0"]
anthropic = ["anthropic>=0.79.0"]
google = ["google-genai>=1.0.0"]  # google-generativeai is EOL; use google-genai
tokens = ["tiktoken>=0.7.0"]

# Orchestrator integrations (for examples/orchestration notebooks)
orchestration = [
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.2.0",
    "crewai>=0.76.0",
    "crewai-tools>=0.16.0",
    "pyautogen>=0.2.0",
    "semantic-kernel>=1.0.0",
]

# Development tools
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
    "mypy>=1.13.0",
    "ruff>=0.7.4",
    "black>=24.10.0",
    "ipython>=8.29.0",
    "pre-commit>=4.0.0",
]

# Tutorial video pipeline
tutorial = [
    "edge-tts>=7.0.0",  # natural voice (default, free)
    "mutagen>=1.47.0",   # MP3 duration for edge-tts output
    "coqui-tts>=0.27.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "transformers>=4.46.0,<4.57.0",  # 4.57+ breaks coqui-tts
]

# Documentation
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.26.0",
]

# All features
all = [
    "mycontext-ai[openai,anthropic,google,tokens]",
]

[project.urls]
Homepage = "https://mycontext-docs.pages.dev/"
Documentation = "https://mycontext-docs.pages.dev/"
Repository = "https://github.com/SadhiraAI/mycontext"
Changelog = "https://github.com/SadhiraAI/mycontext/blob/main/CHANGELOG.md"
Issues = "https://github.com/SadhiraAI/mycontext/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mycontext"]
# Exclude enterprise for free-only PyPI release (remove these lines to include enterprise)
exclude = [
    "src/mycontext/templates/enterprise",
]

[tool.hatch.build.targets.sdist]
# Exclude enterprise and all non-essential repo content to stay under PyPI 100 MB limit
exclude = [
    "src/mycontext/templates/enterprise",
    "docs/",
    "app/",
    "website/",
    "examples/",
    "tutorials/",
    "tools/",
    "output/",
    "tests/",
    ".cursor/",
    ".agent/",
    "*.pdf",
    "*.png",
    "*.jpg",
    "*.ipynb",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "docs",
    "examples",
    "src",
    "research",
    "website",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["B017", "F841", "E722", "E701", "B007"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
]

[tool.coverage.run]
source = ["src/mycontext"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
