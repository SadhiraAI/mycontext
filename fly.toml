# Fly.io deployment configuration
# Docs: https://fly.io/docs/reference/configuration/

app = 'sadhiraai-api'
primary_region = 'iad'  # US East (Washington DC) -- change to your nearest region

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = '8000'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
